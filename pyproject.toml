[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-checker"
version = "0.1.0"
description = "AI-assisted impact analysis for dependent projects during deployment."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.55,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
demo-checker = "deployment_impact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
